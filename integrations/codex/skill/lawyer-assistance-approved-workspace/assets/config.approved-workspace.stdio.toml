[mcp_servers.lawyer_assistance]
command = "C:/LawyerAssistance/bin/lawyer-assistance-mcp.exe"
args = ["--privacy-profile", "approved_case_workspace", "--approved-session-id", "<APP_ISSUED_SERVER_ID>", "stdio"]
enabled = false
required = true
startup_timeout_sec = 20
tool_timeout_sec = 120
enabled_tools = [
  "system_status",
  "legal_search",
  "legal_get_article",
  "legal_get_versions",
  "legal_get_relations",
  "case_list",
  "case_get_public_metadata",
  "case_list_approved_materials",
  "case_read_approved_material",
  "case_search_approved_materials",
  "case_list_work_products",
  "case_read_work_product",
  "case_write_work_product",
  "case_update_work_product",
  "case_export_work_product_manifest",
  "diagram.list_templates",
  "diagram.get_schema",
  "diagram.validate",
  "diagram.render",
  "diagram.update",
  "diagram.export",
]
default_tools_approval_mode = "writes"
