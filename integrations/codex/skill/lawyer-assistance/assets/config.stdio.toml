[mcp_servers.lawyer_assistance]
command = "/absolute/path/to/lawyer-assistance-mcp"
args = ["--privacy-profile", "public_law_only", "stdio"]
env = { LEGAL_DB = "/absolute/path/to/legal_core.sqlite" }
enabled = true
required = true
startup_timeout_sec = 20
tool_timeout_sec = 120
enabled_tools = [
  "system_status",
  "legal_search",
  "legal_get_article",
  "legal_get_versions",
  "legal_get_relations",
  "legal_search_cases",
  "legal_get_case",
]
