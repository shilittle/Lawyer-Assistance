[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/citations",
  "crates/database",
  "crates/domain",
  "crates/providers",
  "crates/retrieval",
  "vendor/minisign-verify",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
citations = { path = "crates/citations" }
database = { path = "crates/database" }
domain = { path = "crates/domain" }
providers = { path = "crates/providers" }
retrieval = { path = "crates/retrieval" }

rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
base64 = "0.22.1"
minisign-verify = { path = "vendor/minisign-verify" }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-single-instance = "2.4.3"
tempfile = "3.23.0"
uuid = { version = "1.19.0", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
