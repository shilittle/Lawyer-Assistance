[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/assistant",
  "crates/citations",
  "crates/database",
  "crates/domain",
  "crates/diagrams",
  "crates/file-ingest",
  "crates/legal-mcp",
  "crates/material-processing",
  "crates/privacy",
  "crates/legal-services",
  "crates/providers",
  "crates/retrieval",
  "vendor/minisign-verify",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.4.0-beta.2"

[workspace.dependencies]
assistant = { path = "crates/assistant" }
citations = { path = "crates/citations" }
database = { path = "crates/database" }
domain = { path = "crates/domain" }
diagrams = { path = "crates/diagrams" }
file-ingest = { path = "crates/file-ingest" }
legal-mcp = { path = "crates/legal-mcp" }
material-processing = { path = "crates/material-processing" }
privacy = { path = "crates/privacy" }
legal-services = { path = "crates/legal-services" }
providers = { path = "crates/providers" }
retrieval = { path = "crates/retrieval" }

rusqlite = { version = "0.40.1", features = ["bundled", "backup", "functions", "serialize"] }
base64 = "0.22.1"
jsonschema = { version = "=0.48.2", default-features = false }
minisign-verify = { path = "vendor/minisign-verify" }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1.12.4"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-single-instance = "2.4.3"
tempfile = "3.23.0"
uuid = { version = "1.19.0", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zeroize = "1.9.0"

[profile.release.package.legal-mcp]
# The server is I/O-bound; O2 with bounded codegen parallelism also avoids an
# LLVM 22/O3 access violation observed in Windows MSVC release builds.
opt-level = 2
codegen-units = 4

[profile.release.package.privacy]
# The privacy vNext crate hits the same Windows MSVC LLVM/O3 access-violation class.
opt-level = 2
codegen-units = 4

[profile.release.package.database]
# The database crate also trips Windows MSVC LLVM/O3 during desktop release packaging.
opt-level = 2
codegen-units = 4

[profile.release.package.urlpattern]
# The transitive urlpattern crate trips Windows MSVC LLVM/O3 during desktop release packaging.
opt-level = 2
codegen-units = 4
[profile.release]
# Windows MSVC release/O3 is unstable for this workspace on the release machine.
opt-level = 2
codegen-units = 4
