[package]
name = "file-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encoding_rs = "=0.8.35"
image = { version = "=0.25.8", default-features = false, features = ["png", "webp"] }
infer = { version = "=0.19.0", default-features = false }
lopdf = { version = "=0.44.0", default-features = false }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
quick-xml = { version = "=0.39.4", default-features = false }
sha2 = "=0.10.9"
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
