[package]
name = "workspace-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# A default-off, test-only subprocess fault path. Release packages are built without it.
document-worker-fault-injection = []

[dependencies]
base64.workspace = true
domain.workspace = true
file-ingest.workspace = true
legal-services.workspace = true
privacy.workspace = true
privacy-text.workspace = true
providers.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
zeroize.workspace = true
windows-sys.workspace = true
subtle = "2.6"
pulldown-cmark = "=0.13.4"
tempfile.workspace = true
tokio = { version = "1.49", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
tokio-util = "0.7"
zip = { version = "=2.4.2", default-features = false }

[dev-dependencies]
tempfile.workspace = true
