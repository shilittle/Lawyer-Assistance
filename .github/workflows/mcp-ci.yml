name: MCP server CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: legal-mcp (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Install locked frontend notice dependencies
        run: pnpm --filter "@lawyer-assistance/desktop..." --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: legal-mcp-${{ matrix.target }}

      - name: Validate checked-in host configs and self-contained Skill packages
        run: |
          python -m unittest integrations.test_validate_examples
          python integrations/validate_examples.py
          python -m unittest integrations.test_validate_approved_workspace_examples
          python integrations/validate_approved_workspace_examples.py

      - name: Check server crates
        run: cargo check --locked -p file-ingest -p legal-services -p legal-mcp --all-targets --all-features

      - name: Lint server crates
        run: cargo clippy --locked -p file-ingest -p legal-services -p legal-mcp --all-targets --all-features -- -D warnings

      - name: Test server crates
        run: cargo test --locked -p file-ingest -p legal-services -p legal-mcp --all-targets --all-features

      - name: Build release server
        run: cargo build --release --locked -p legal-mcp --bin lawyer-assistance-mcp

      - name: Verify formal release contract and exact MCP version output
        shell: pwsh
        run: |
          $suffix = if ('${{ runner.os }}' -eq 'Windows') { '.exe' } else { '' }
          $binary = "target/${{ matrix.target }}/release/lawyer-assistance-mcp$suffix"
          python -m unittest scripts.test_release_contract scripts.test_verify_updater_signature
          python scripts/check_release_contract.py --root . --contract scripts/release/release-contract-v0.4.0.json --mode formal --mcp-binary $binary

      - name: Fetch complete release notice dependency closure
        run: cargo fetch --locked --target x86_64-pc-windows-msvc --target x86_64-unknown-linux-gnu --target aarch64-apple-darwin

      - name: Verify complete desktop and MCP notices
        run: |
          python -m unittest scripts.test_generate_third_party_notices
          python scripts/generate_third_party_notices.py --check

      - name: Test and assemble verified MCP release archive
        id: package
        shell: pwsh
        run: |
          python -m unittest scripts.test_package_mcp_release
          $suffix = if ('${{ runner.os }}' -eq 'Windows') { '.exe' } else { '' }
          $binary = "target/${{ matrix.target }}/release/lawyer-assistance-mcp$suffix"
          $json = python scripts/package_mcp_release.py --target '${{ matrix.target }}' --binary $binary --output-dir dist/mcp --version-gate-mode formal --expected-commit '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'MCP release packaging failed' }
          $result = $json | ConvertFrom-Json
          "archive=$($result.archive)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum=$($result.checksum)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload verified MCP release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lawyer-assistance-mcp-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
