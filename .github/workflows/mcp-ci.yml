name: Public MCP CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-mcp:
    name: public MCP (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "4"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          target: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: public-mcp-${{ matrix.target }}

      - name: Check public MCP crates
        run: cargo check --locked --target ${{ matrix.target }} -p file-ingest -p legal-services -p legal-mcp --all-targets --all-features

      - name: Test public MCP crates
        run: cargo test --locked --target ${{ matrix.target }} -p file-ingest -p legal-services -p legal-mcp --all-targets --all-features

      - name: Build public MCP binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p legal-mcp --bin lawyer-assistance-mcp

      - name: Check the package validation tests on Linux
        if: matrix.os == 'ubuntu-latest'
        run: python -m unittest scripts.test_package_portable -v

      - name: Check judicial corpus parser tests on Linux
        if: matrix.os == 'ubuntu-latest'
        run: python -m unittest data.build.test_build_judicial_cases -v
