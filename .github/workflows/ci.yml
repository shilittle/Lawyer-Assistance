name: Web and Rust CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows server and WebUI
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "4"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Install Python for synthetic smoke fixture
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: web-rust-windows

      - name: Install WebUI dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint the server workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test the server workspace
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build the Windows server and public MCP binaries
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc -p lawyer-assistance-server --bin lawyer-assistance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --target x86_64-pc-windows-msvc -p legal-mcp --bin lawyer-assistance-mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test the WebUI
        shell: pwsh
        run: |
          pnpm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run every Python regression module without network access
        run: python -c "import subprocess,sys; from scripts.audit_validate import discover_python_tests,DEFAULT_ROOT; sys.exit(subprocess.call([sys.executable,'-m','unittest',*discover_python_tests(DEFAULT_ROOT),'-v']))"

      - name: Prepare synthetic non-distribution legal fixture for Web smoke
        shell: pwsh
        run: |
          $legalDb = Join-Path $env:RUNNER_TEMP "legal_core_web_smoke.synthetic.sqlite"
          python scripts/prepare_web_smoke_db.py --output $legalDb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $legalDb -PathType Leaf)) {
            throw "Synthetic Web smoke legal fixture was not created."
          }

      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install chromium

      - name: Run deterministic editor, capability, sanitizer and context regressions
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ("lawyer-retest-" + [guid]::NewGuid().ToString("N"))
          node scripts/audit_editor_retest.mjs --postfix --output (Join-Path $evidence "editor")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/audit_contract_retest.mjs --source $env:GITHUB_WORKSPACE --output (Join-Path $evidence "contracts")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/audit_context_ranges_web.mjs --root $env:GITHUB_WORKSPACE --output (Join-Path $evidence "context")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run HTTP and browser smoke
        shell: pwsh
        run: |
          $smokeData = Join-Path $env:RUNNER_TEMP ("lawyer-assistance-smoke-" + [guid]::NewGuid().ToString("N"))
          $legalDb = Join-Path $env:RUNNER_TEMP "legal_core_web_smoke.synthetic.sqlite"
          $server = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\lawyer-assistance.exe"
          if (-not (Test-Path -LiteralPath $legalDb -PathType Leaf)) { throw "Synthetic Web smoke legal fixture is missing." }
          New-Item -ItemType Directory -Force -Path $smokeData | Out-Null
          $process = Start-Process -FilePath $server -ArgumentList @(
            "serve", "--port", "8877", "--data-dir", $smokeData, "--legal-db", $legalDb
          ) -PassThru -WindowStyle Hidden
          try {
            $descriptor = Join-Path $smokeData "connection.dpapi"
            for ($attempt = 0; $attempt -lt 60 -and -not (Test-Path -LiteralPath $descriptor); $attempt++) {
              if ($process.HasExited) { throw "server exited before writing its connection descriptor ($($process.ExitCode))" }
              Start-Sleep -Milliseconds 500
            }
            if (-not (Test-Path -LiteralPath $descriptor)) { throw "server did not write its connection descriptor" }
            node scripts/smoke_web.mjs --data-dir $smokeData --require-browser
            if ($LASTEXITCODE -ne 0) { throw "Web smoke failed" }
            node scripts/smoke_mcp.mjs --data-dir $smokeData --legal-db $legalDb
            if ($LASTEXITCODE -ne 0) { throw "MCP smoke failed" }
            & $server stop --data-dir $smokeData
            if ($LASTEXITCODE -ne 0) { throw "Graceful shutdown failed" }
            if (-not $process.WaitForExit(15000)) { throw "Server did not exit after CLI stop" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Wait-Process -Id $process.Id -Timeout 10 -ErrorAction SilentlyContinue
          }

      - name: Test portable package validation
        run: pnpm run test:portable
