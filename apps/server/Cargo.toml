[package]
name = "lawyer-assistance-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lawyer-assistance"
path = "src/main.rs"

[dependencies]
workspace-service.workspace = true
privacy-text.workspace = true
privacy.workspace = true
legal-services.workspace = true
legal-mcp.workspace = true
domain.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
windows-sys.workspace = true
axum = { version = "0.8", features = ["http1", "json", "tokio", "multipart"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
futures-util = "0.3"
subtle = "2.6"
dirs = "6.0"
url = "2.5"
tokio-util = "0.7"
reqwest.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
